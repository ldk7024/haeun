spring:
  application:
    name: haeun

  datasource:
    url: jdbc:h2:mem:haeundb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

server:
  port: 8080

# ============================================================
# HAEUN AI 설정
# provider: ollama | mock
# Ollama가 실행 중이면 ollama 사용, 아니면 mock으로 자동 fallback
# 현재 PC에 설치된 Ollama 모델:
# - qwen2.5:7b
# - gemma3:latest
# ============================================================
haeun:
  ai:
    provider: ollama
    ollama:
      base-url: http://localhost:11434

      # 현재 PC에 설치된 모델을 사용한다.
      # 추천: qwen2.5:7b
      # 다른 선택지: gemma3:latest
      model: gemma3:latest

      timeout-seconds: 60

  memory:
    vector:
      # Python Vector Memory Service 활성화 여부
      # true : python-memory-service를 먼저 실행한 뒤 활성화 (의미 기억 검색)
      # false: 기존 Java 키워드 기억만 사용 (Python 없이 동작, 기본값)
      enabled: false
      base-url: http://localhost:8001
      top-k: 5
      timeout-seconds: 5

logging:
  level:
    com.haeun: DEBUG