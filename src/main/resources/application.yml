spring:
  application:
    name: haeun

  datasource:
    url: jdbc:h2:mem:haeundb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

server:
  port: 8080

# ============================================================
# HAEUN AI 설정
# provider: ollama | mock
# Ollama가 실행 중이면 ollama 사용, 아니면 mock으로 자동 fallback
# 현재 PC에 설치된 Ollama 모델:
# - gemma4:e4b
# - qwen2.5:7b
# - gemma3:latest
# ============================================================
haeun:
  ai:
    provider: ollama
    ollama:
      base-url: http://localhost:11434

      # 기본 모델 (UI 드롭다운 초기 선택값)
      model: gemma4:e4b

      # UI 드롭다운에 표시할 선택 가능 모델 목록
      # ollama list 로 설치 확인 후 추가/제거한다.
      available-models:
        - "gemma4:e4b"
        - "qwen2.5:7b"
        - "gemma3:latest"

      # read timeout — gemma4 등 대형 모델 생성 시간 대응 (connect는 코드에서 30초 고정)
      timeout-seconds: 300

  memory:
    vector:
      # Python Vector Memory Service 활성화 여부
      # true : python-memory-service를 먼저 실행한 뒤 활성화 (의미 기억 검색)
      # false: 기존 Java 키워드 기억만 사용 (Python 없이 동작, 기본값)
      enabled: false
      base-url: http://localhost:8001
      top-k: 5
      timeout-seconds: 5

logging:
  level:
    com.haeun: DEBUG